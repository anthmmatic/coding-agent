name: "Copilot Setup Steps"

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST: "test"
      COPILOT_MCP_TEST: "mcptest"
    steps:
      - run: |
          VALUE1="test1" >> "$GITHUB_ENV"
          COPILOT_MCP_VALUE2="mytest" >> "$GITHUB_ENV"
      - run: |
          echo ${TEST}
          echo ${COPILOT_MCP_TEST}
